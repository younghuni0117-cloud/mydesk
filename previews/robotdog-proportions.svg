<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">로봇독 측면 비율 검토 시안</title><desc id="desc">대부분 일정한 폭을 유지하고 무릎 근처 끝부분만 부드럽게 가늘어지는 노란 상부 다리, 앞으로 완만하게 휜 가느다란 검은 하부 링크. 실제 프로그램 화면이 아닌 단순 디자인 시안.</desc>
