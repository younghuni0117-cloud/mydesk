<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>Cart-Pole Evolution Lab | My Desk</title>
  <link rel="stylesheet" href="style.css?v=update69">
  <link rel="stylesheet" href="cartpole-evolution.css?v=reset1">
</head>
<body class="game-page cpe-page" data-page="cartpole-evolution">
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <aside class="sidebar" id="sidebar" aria-label="사이드 메뉴">
    <a class="brand" href="index.html"><span class="brand-mark">M<span>·</span></span><span>My Desk<small>나의 정보와 기록</small></span></a>
    <nav aria-label="주 메뉴">
      <a class="nav-item" href="index.html">홈</a>
      <a class="nav-item" href="cartpole-evolution.html">카트폴</a>
      <a class="nav-item" href="cartpole-evolution.html" aria-current="page">Cart-Pole Evolution Lab</a>
    </nav>
    <a class="nav-manage" href="menus.html">메뉴 관리</a>
  </aside>
  <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="메뉴 닫기" tabindex="-1" hidden></button>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-location">
        <button class="menu-toggle" id="menu-toggle" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">☰</button>
        <a href="index.html">내 공간</a>
      </div>
    </header>
    <main id="main-content" class="cpe-lab" tabindex="-1">
      <div class="cpe-grid">
        <div class="cpe-view">
        <section class="cpe-stage" aria-label="실시간 물리">
          <canvas id="cpe-canvas" aria-label="수평 카트와 수동 링크의 현재 물리 상태"></canvas>
          <div class="cpe-overlay cpe-stage-top"><strong id="cpe-state" role="status">불러오는 중</strong><span id="cpe-live">실시간 관찰</span></div>
        </section>
          <div class="cpe-stats" aria-label="학습 및 시뮬레이션 지표">
            <div><span>에피소드</span><strong id="cpe-episode">0</strong></div>
            <div><span title="화면에 표시된 에피소드 경과 시간">학습시간</span><strong id="cpe-time">0.00초</strong></div>
            <div><span>직립</span><strong id="cpe-hold">0.00 / 20초</strong></div>
          </div>
          <div class="cpe-progress">
            <progress id="cpe-progress" value="0" max="1" aria-label="학습 진행률"></progress>
            <output id="cpe-progress-text" for="cpe-count">0 / 0</output>
          </div>
        </div>
        <aside class="cpe-panel" aria-label="훈련 설정과 성과" tabindex="0">
        <section class="cpe-chart-box" aria-label="보상 그래프">
          <canvas id="cpe-chart" role="img" aria-label="세로축 누적 보상, 가로축 에피소드"></canvas>
        </section>
        <section class="cpe-control" aria-label="훈련 조작">
          <div class="cpe-actions cpe-primary-actions">
            <button id="cpe-train" type="button" disabled>학습 시작</button>
            <button id="cpe-model" type="button" disabled>모델 실행</button>
            <button id="cpe-impact" type="button" disabled>충격</button>
          </div>
          <div class="cpe-inputs">
            <label>레벨<select id="cpe-level"><option value="1">링크 1개</option></select></label>
            <label>학습 횟수<input id="cpe-count" type="number" min="1" max="100000" step="1" value="1000" inputmode="numeric"></label>
            <label>동시 환경<select id="cpe-env"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
            <label>시도 시간 (초)<input id="cpe-seconds" type="number" min="25" max="60" step="1" value="30" inputmode="numeric"></label>
          </div>
        </section>
          <details class="cpe-options">
            <summary>상세 옵션</summary>
            <span id="cpe-sync" role="status"></span>
            <label class="cpe-guides"><input id="cpe-guides" type="checkbox" checked> 중심축과 화살표 표시</label>
            <label class="cpe-guides"><input id="cpe-impact-enabled" type="checkbox"> 학습 중 외부 충격</label>
            <div class="cpe-inputs">
              <label>충격 간격 (초)<input id="cpe-impact-interval" type="number" min="0.2" max="60" step="0.1" value="3"></label>
              <label>최소 하중 (N)<input id="cpe-impact-min" type="number" min="0" max="100" step="0.5" value="2"></label>
              <label>최대 하중 (N)<input id="cpe-impact-max" type="number" min="0" max="100" step="0.5" value="5"></label>
            </div>
            <label class="cpe-range">그래프 가로축
              <select id="cpe-range">
                <option value="500">최근 500회</option><option value="1000">최근 1,000회</option>
                <option value="2000">최근 2,000회</option><option value="5000">최근 5,000회</option>
                <option value="10000">최근 10,000회</option><option value="0">전체 범위</option>
              </select>
            </label>
            <div class="cpe-actions"><button id="cpe-reset" type="button" disabled>현재 레벨 초기화</button></div>
          </details>
        </aside>
      </div>
    </main>
  </div>
  <script src="shell.js?v=shortcuts2"></script>
  <script type="module" src="cartpole-evolution.js?v=servo1"></script>
</body>
</html>
