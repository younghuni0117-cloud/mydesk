<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>포스트잇 게시판 | My Desk</title><link rel="stylesheet" href="style.css?v=update69"><link rel="stylesheet" href="sticky.css?v=1"></head>
<body data-page="sticky"><aside class="sidebar" id="sidebar"><a class="brand" href="index.html">My Desk</a><nav aria-label="주 메뉴"></nav><a href="menus.html">메뉴 관리</a></aside><button class="sidebar-backdrop" id="sidebar-backdrop" hidden aria-label="메뉴 닫기"></button><div class="workspace"><header class="topbar"><div class="topbar-location"><button class="menu-toggle" id="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button></div></header>
<main id="main-content" class="sticky-app"><div class="board-toolbar"><h1>작은 생각을 붙여두는 곳</h1><button id="new-note">+ 새 메모</button><div class="board-zoom"><button id="zoom-out" aria-label="축소">−</button><button id="zoom-reset">100%</button><button id="zoom-in" aria-label="확대">+</button></div><button id="connect">기기 연결</button><button id="backup">백업</button></div>
<p id="save-status" role="status">메모 불러오는 중…</p><section id="board" aria-label="포스트잇 칠판"><div class="board-chalk" aria-hidden="true">오늘의 작은 생각들</div><div id="board-world"></div><p id="board-empty">새 메모를 붙여보세요.<br><span>메모 위쪽을 잡아 옮기고, 빈 칠판을 밀어 둘러보세요.</span></p><div class="board-bins"><button id="archive-bin" class="board-bin" data-bin="archived"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 19h32v23H8z" fill="#d1b38b"/><path d="M5 12h38v9H5z" fill="#e6cba6"/><path d="M19 28h10" stroke="#87674b" stroke-width="3" stroke-linecap="round"/></svg><span>보관함 <b id="archive-count">0</b></span></button><button id="trash-bin" class="board-bin" data-bin="trashed"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="m12 17 3 25h18l3-25" fill="#c6d1ca"/><path d="M9 14h30M19 9h10m-9 13 1 15m7-15-1 15" stroke="#83988b" stroke-width="3" stroke-linecap="round"/></svg><span>휴지통 <b id="trash-count">0</b></span></button></div></section>
<p class="board-hint">Ctrl+휠 · 두 손가락 확대/축소 · 윗부분 드래그 이동 · 오른쪽 아래 모서리로 크기 조절</p></main></div>
<dialog id="bin-dialog"><header><h2 id="bin-title"></h2><div><button id="empty-trash" hidden>휴지통 비우기</button><button id="close-bin">닫기</button></div></header><div id="bin-list"></div></dialog>
<dialog id="connect-dialog"><header><h2>같은 게시판 연결</h2><button id="close-connect">닫기</button></header><p>다른 기기에서 이 연결 링크를 열면 같은 메모가 나타납니다. 링크를 가진 사람은 메모를 읽고 수정할 수 있습니다.</p><button id="copy-link">현재 게시판 연결 링크 복사</button><label>다른 게시판의 연결 링크<input id="connection-input" type="url" autocomplete="off" placeholder="전달받은 연결 링크"></label><button id="open-connection">연결하기</button><p id="connection-status" role="status"></p><label>내려받은 백업 복원<input id="restore-file" type="file" accept="application/json,.json"></label></dialog>
<script src="shell.js?v=sticky1"></script><script type="module" src="sticky.js?v=1"></script></body></html>
